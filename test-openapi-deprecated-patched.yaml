openapi: 3.0.3
info:
  title: Deprecated Enums Test API
  version: 1.0.1
  description: |
    PATCHED spec (v1.0.1) — conversion to Avro SUCCEEDS.
    Every field whose enum is invalid for Avro is marked `deprecated: true` and points to
    a valid replacement field via `x-replaced-by`. The converter drops the deprecated
    invalid fields (with a WARN on stderr) and keeps everything else, including the
    replacement fields, which are regular properties of this spec.
paths: {}

components:
  schemas:

    Booking:
      type: object
      description: A train ticket booking
      required:
        - bookingId
      properties:
        bookingId:
          type: string
          format: uuid

        # Case 1 — inline enum, invalid symbols, deprecated → DROPPED
        travelClass:
          type: string
          description: DEPRECATED - use travelClassCode instead
          deprecated: true
          x-replaced-by: travelClassCode
          enum: [1ST_CLASS, 2ND_CLASS]
        travelClassCode:
          type: string
          description: Travel class
          enum: [FIRST_CLASS, SECOND_CLASS]

        # Case 2 — $ref to a deprecated component enum, invalid symbol → DROPPED
        # (deprecated is carried by the TicketFormat component below)
        ticketFormat:
          $ref: '#/components/schemas/TicketFormat'
        ticketFormatCode:
          $ref: '#/components/schemas/TicketFormatCode'

        # Case 3 — deprecated array of invalid enums → DROPPED
        mealOptions:
          type: array
          description: DEPRECATED - use mealCodes instead
          deprecated: true
          x-replaced-by: mealCodes
          items:
            type: string
            enum: [0_MEAL, VEGETARIAN, STANDARD]
        mealCodes:
          type: array
          description: Meals ordered on board
          items:
            type: string
            enum: [NO_MEAL, VEGETARIAN, STANDARD]

        # Case 4 — deprecated but VALID enum → KEPT (nothing to fix for Avro)
        channel:
          type: string
          description: DEPRECATED - use salesChannel instead
          deprecated: true
          x-replaced-by: salesChannel
          enum: [WEB, MOBILE]
        salesChannel:
          type: string
          enum: [WEB, MOBILE, COUNTER]

        # Valid enum — always converted
        status:
          type: string
          enum: [CONFIRMED, CANCELLED]

    TicketFormat:
      type: string
      description: DEPRECATED - use TicketFormatCode instead
      deprecated: true
      x-replaced-by: TicketFormatCode
      enum: [PDF, 2D_BARCODE]

    TicketFormatCode:
      type: string
      description: Ticket delivery format
      enum: [PDF, BARCODE_2D]
